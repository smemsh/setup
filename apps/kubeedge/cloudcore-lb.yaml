#
---

apiVersion: v1
kind: Service
metadata:
  name: cloudcore-external
  namespace: kubeedge
spec:
  type: LoadBalancer
  loadBalancerIP: ${KUBEEDGE_LBIP}
  selector:
    k8s-app: kubeedge
  ports:
    - name: cloudhub-websocket
      port: 10000
      targetPort: 10000
      protocol: TCP
    - name: cloudhub-https
      port: 10002
      targetPort: 10002
      protocol: TCP
