#
---

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 86400h
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/omniplex/apps
  prune: true
  dependsOn:
    - name: infra
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets-decrypted
        optional: true
