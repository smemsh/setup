#
---

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra
  namespace: flux-system
spec:
  interval: 86400h
  dependsOn:
    - name: secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/omniplex/infra
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: lb-secrets
      - kind: Secret
        name: kubeedge-secrets
